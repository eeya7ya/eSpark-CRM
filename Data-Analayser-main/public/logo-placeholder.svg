<svg xmlns="http://www.w3.org/2000/svg" width="220" height="60" viewBox="0 0 220 60" role="img" aria-label="eSpark">
  <!--
    Fallback wordmark used when no COMPANY_LOGO_URL is configured and the
    raster /logo.png is unavailable. Kept text-based (no glyph geometry) so it
    stays tiny and renders identically without the brand font installed.
  -->
  <style>
    .wm { font: 700 30px "Geist", "Inter", "Segoe UI", sans-serif; fill: #2b2f30 }
    .e  { fill: #4c626a }
    .ar { font: 400 11px "Cairo", "Tahoma", sans-serif; fill: #5f6668 }
  </style>
  <text x="6" y="30" class="ar">إي سبارك</text>
  <text x="6" y="54" class="wm"><tspan class="e">e</tspan>Spark</text>
</svg>
